name: Release

# Run by hand: Actions, Release, Run workflow, and enter the version (for example 0.1.0).
# It runs the tests, checks the version against the page and the changelog, then creates the tag and the GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The version must look like 0.1.0"; exit 1; }
          grep -q "Budgeteer $VERSION" docs/index.html || { echo "docs/index.html does not show version $VERSION"; exit 1; }
          awk -v v="$VERSION" '/^## /{p=($2==v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Budgeteer $VERSION" --notes-file notes.md
