name: Release

# Run by hand: Actions, Release, Run workflow, and enter the version (for example 0.2.1). The steps are in RELEASING.md.
# It runs the tests, checks the version, the footer and the changelog (.github/scripts/release-notes.sh),
# then creates the tag and the GitHub release with the changelog section of the version as its notes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Check the release and write the notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PREV="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          .github/scripts/release-notes.sh "$VERSION" "$PREV" > notes.md
          cat notes.md
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Budgeteer $VERSION" --notes-file notes.md
