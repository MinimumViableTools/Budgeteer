<!doctype html>
<html lang="en" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budgeteer</title>
<meta name="description" content="A project budget calculator for exploring planning scenarios. Everything stays in your browser.">
<link rel="stylesheet" href="design/fonts.css">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/components.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to the plan</a>
<div class="page">
  <header class="top">
    <div>
      <h1>Budgeteer</h1>
      <div class="tagline"><span id="typed">Plan what fits, then see what does not.</span><span class="caret" aria-hidden="true"></span></div>
    </div>
    <div class="stamp-row" id="headActions"></div>
  </header>
  <p class="notice" id="notice" role="status" aria-live="polite"></p>
  <main id="main" class="stack">
    <section class="panel" aria-labelledby="h-settings">
      <h2 id="h-settings">Plan settings</h2>
      <div class="settings">
        <div class="set"><span class="pk-label" id="lblView">View</span>
          <div class="seg" role="group" aria-labelledby="lblView">
            <button type="button" id="vMonth" aria-pressed="true">Months</button>
            <button type="button" id="vQuarter" aria-pressed="false">Quarters</button>
          </div></div>
        <div class="set"><label class="pk-label" for="length" id="lblLen">Number of months (1 to 12)</label>
          <input class="pk-input" id="length" inputmode="numeric" autocomplete="off"></div>
        <div class="set"><label class="pk-label" for="bMax">Max budget (€)</label>
          <input class="pk-input" id="bMax" inputmode="numeric" autocomplete="off" style="width:130px"></div>
        <div class="set"><label class="pk-label" for="bStr">Stretch budget (€)</label>
          <input class="pk-input" id="bStr" inputmode="numeric" autocomplete="off" style="width:130px"></div>
        <div class="set"><span class="pk-label" id="lblScn">Scenario</span>
          <div class="seg" role="group" aria-labelledby="lblScn">
            <button type="button" id="sMax" aria-pressed="false">Max</button>
            <button type="button" id="sStr" aria-pressed="true">Stretch</button>
          </div></div>
      </div>
      <p class="hint" id="viewHint"></p>
    </section>

    <section class="panel" aria-labelledby="h-chart">
      <div class="panel-head"><h2 id="h-chart">Cost and budget</h2><div class="legend" id="legend"></div></div>
      <div class="charts" id="charts">
        <figure class="fig"><p class="chart-title" id="costTitle"></p><div id="costChart" class="chartbox"></div><figcaption class="sr-only" id="costAlt"></figcaption></figure>
        <figure class="fig fig-side"><p class="chart-title" id="headTitle">Plan total against budget</p><div class="stamp-row" id="headStatus"></div><div id="headChart" class="chartbox"></div><figcaption class="sr-only" id="headAlt"></figcaption></figure>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-sum">
      <h2 id="h-sum">Summary</h2>
      <div class="sumgrid">
        <div class="sumleft">
          <div class="sum-total" id="sumTotal"></div>
          <div class="stamp-row" id="sumStatus"></div>
          <div class="sum-lines" id="sumLines"></div>
        </div>
        <div class="sum-text" id="sumText"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-res">
      <div class="panel-head"><h2 id="h-res">Resources</h2><p class="hint" id="resHint"></p></div>
      <div class="chips" id="tplChips" role="group" aria-label="Add a resource"></div>
      <div class="cards" id="cards"></div>
    </section>
  </main>
</div>
<div class="totalbar" id="totalbar" role="region" aria-label="Scenario total"><div class="totalbar-in">
  <span><span class="tb-label" id="tbLabel"></span><br><span class="tb-num" id="tbNum"></span></span>
  <div class="tb-track" id="tbTrack" aria-hidden="true"><div class="tb-fill" id="tbFill"></div><div class="tb-mark" id="tbMax"><span>Max</span></div><div class="tb-mark str" id="tbStr"><span>Stretch</span></div></div>
  <span id="tbStamp"></span>
</div></div>
<script src="js/core.js"></script>
<script src="js/codec.js"></script>
<script src="js/sample.js"></script>
<script src="js/state.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui-resources.js"></script>
<script src="js/ui-charts.js"></script>
<script src="js/ui-summary.js"></script>
<script src="js/main.js"></script>
</body>
</html>
